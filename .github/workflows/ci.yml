name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to a branch cancels the previous run for that branch -- but never
# on main, where every commit's result is a record worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The default GITHUB_TOKEN is broad. Declared explicitly at the top level so
# every job starts from read-only and has to opt in to more.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Lint and types fail in under a minute, so a typo does not
  # wait behind a full test matrix.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        # GitHub's annotation format puts findings inline on the PR diff
        # instead of making a reviewer read the log.
        run: ruff check --output-format=github app tests

      - name: Ruff format
        run: ruff format --check app tests

      - name: mypy (strict)
        run: mypy

  # ---------------------------------------------------------------------------
  # Unit tests. No service containers at all -- the suite runs on SQLite, so
  # this job is fast and cannot be flaky for infrastructure reasons.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # One version failing should not hide the result for the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest -m "not integration" \
            --cov --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml

      - name: Enforce coverage floor
        # A floor, not a target. It exists to catch a PR that deletes tests,
        # not to encourage writing assertions that only move a number.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          floor = 85.0
          print(f"line coverage: {rate:.2f}% (floor {floor}%)")
          sys.exit(0 if rate >= floor else 1)
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Integration tests against real PostgreSQL. Separated from the unit job so
  # a database hiccup cannot mask a genuine code failure, and so unit feedback
  # is not slowed down by waiting for a container to become healthy.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Without the health check the job races the database and fails
        # intermittently on a cold runner.
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_DATABASE_URL: postgresql+psycopg://app:ci-only-not-a-real-secret@localhost:5432/app
      TEST_POSTGRES_DSN: postgresql+psycopg://app:ci-only-not-a-real-secret@localhost:5432/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify migrations apply cleanly
        # Catches a migration that only works against an already-migrated
        # database -- the failure mode that shows up in production first.
        run: alembic upgrade head

      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check for un-generated model changes
        # If the ORM and the migrations have drifted, autogenerate produces a
        # non-empty diff. Finding that here beats finding it at deploy time.
        run: |
          set -euo pipefail
          before=$(ls alembic/versions/*.py)
          alembic revision --autogenerate -m drift-check --rev-id drift_check
          # Diff the directory rather than globbing on the message: alembic
          # slugifies "drift-check" to "drift_check", so a glob written from
          # the message silently matches nothing and the check always passes.
          generated=$(ls alembic/versions/*.py | grep -vxF "$before" || true)
          if [ -z "$generated" ]; then
            echo "::error::Expected autogenerate to produce a revision file; none appeared."
            exit 1
          fi
          echo "generated: $generated"
          if grep -qE "op\.(create|drop|alter|add)" "$generated"; then
            echo "::error::Model changes are not captured in a migration."
            cat "$generated"
            rm -f "$generated"
            exit 1
          fi
          rm -f "$generated"

      - name: Run integration tests
        run: pytest -m integration -v

  # ---------------------------------------------------------------------------
  # Configuration that is not Python still has to be valid.
  # ---------------------------------------------------------------------------
  validate-manifests:
    name: Validate Docker, Kubernetes, Helm, Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint and template
        run: |
          helm lint helm/devops-demo
          for values in values.yaml values-dev.yaml values-prod.yaml; do
            echo "--- $values"
            helm template devops-demo helm/devops-demo \
              -f "helm/devops-demo/$values" > /dev/null
          done

      - name: Validate Kubernetes manifests
        # kubeconform, not `kubectl --dry-run`: it validates against the
        # upstream OpenAPI schemas without needing a live cluster to talk to.
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -ignore-missing-schemas k8s/
          helm template devops-demo helm/devops-demo -f helm/devops-demo/values-prod.yaml \
            | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas -

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt and validate
        run: |
          terraform fmt -check -recursive terraform/
          for env in dev prod; do
            echo "--- $env"
            # -backend=false: validation must not need credentials or a real
            # state bucket, so it can run on every PR from a fork.
            terraform -chdir="terraform/environments/$env" init -backend=false -input=false
            terraform -chdir="terraform/environments/$env" validate
          done

  # ---------------------------------------------------------------------------
  # A single required check for branch protection, so adding a job to the
  # matrix above does not mean editing the protection rule every time.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, integration-tests, validate-manifests]
    if: always()

    steps:
      - name: Fail if any dependency failed
        # `needs.*.result` is checked explicitly because a skipped or
        # cancelled job does not fail this job by default.
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
