name: Feature request
description: Propose a capability
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem being solved. Not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: impact
    attributes:
      label: Does this touch
      options:
        - label: The public API contract
        - label: The database schema
        - label: Deployment or infrastructure
        - label: Security posture
