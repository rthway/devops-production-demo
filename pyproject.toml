[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-production-demo"
version = "1.0.0"
description = "Production-shaped FastAPI service used as a reference DevOps platform: Docker, Kubernetes, Terraform, CI/CD, observability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roshan Kumar Thapa" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "prometheus-client>=0.20,<1.0",
    "structlog>=24.1,<26.0",
    "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "bandit[toml]>=1.7,<2.0",
    "types-passlib",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff: lint + format. Kept as one tool so CI has one less thing to install.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit-style security rules
    "C4", "SIM",     # comprehensions / simplification
    "RUF",
]
ignore = [
    "S101",  # asserts are the point of a test suite
]

[tool.ruff.lint.per-file-ignores]
# Tests bind to fixtures and use hardcoded demo credentials on purpose.
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]

# ---------------------------------------------------------------------------
# mypy: strict on application code. Migrations are generated, so they are out.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL instance (deselect with '-m \"not integration\"')",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
