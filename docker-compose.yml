# Production-shaped local stack: nginx -> api -> postgres, plus the
# observability trio. `docker compose up -d` brings up the whole thing.
#
# The `version:` key is deliberately absent -- it has been obsolete since
# Compose v2 and only emits a warning.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dpd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # scram-sha-256 rather than the md5 default: md5 is deprecated upstream
      # and weak if a dump of pg_authid ever escapes.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -U matters: pg_isready without it probes the wrong role and can pass
      # while the application role does not yet exist.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    logging: *default-logging
    # Not published to the host. Nothing outside the compose network needs to
    # reach Postgres; docker-compose.dev.yml opens it for psql/DBeaver.
    expose:
      - "5432"

  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: devops-production-demo:local
    container_name: dpd-api
    restart: unless-stopped
    depends_on:
      db:
        # service_healthy, not service_started: without it the API starts
        # before Postgres accepts connections and the first migration fails.
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-app}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_JSON: ${APP_LOG_JSON:-true}
      RUN_MIGRATIONS: "true"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks: [backend, frontend]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL

  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: dpd-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [frontend]
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dpd-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [backend, frontend]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dpd-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [frontend]
    logging: *default-logging

  loki:
    image: grafana/loki:3.1.1
    container_name: dpd-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks: [frontend]
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.1.1
    container_name: dpd-promtail
    restart: unless-stopped
    depends_on: [loki]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Read-only, and only for Docker service discovery -- see the comment in
      # promtail-config.yml about why this is scoped and what it costs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [frontend]
    logging: *default-logging

networks:
  # Two networks so the database does not share a segment with Grafana or
  # nginx: only `api` and `prometheus` are attached to both.
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  pgdata:
  promdata:
  grafanadata:
  lokidata:
