# Reverse proxy in front of the API. Terminates client connections, adds the
# security headers the application should not have to think about, and rate
# limits requests before they ever reach a Python worker.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access logs, so Promtail ships them to Loki without a custom
    # parsing pattern. request_id is echoed so nginx logs and application
    # logs can be joined on a single field.
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,'
        '"body_bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 1m;

    # Do not advertise the exact nginx version to every scanner on the internet.
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # 20 r/s per client IP with a burst of 40. Cheap protection that runs
    # before any Python process is involved.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    upstream api_backend {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The proxy's own health, so a probe can tell "proxy down" apart from
        # "upstream down" instead of returning one ambiguous 502.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # /metrics must not be reachable from outside: it leaks traffic
        # volume, latency and route names. Prometheus scrapes the API
        # container directly on the backend network instead.
        location = /metrics {
            deny all;
            return 404;
        }

        location / {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $http_x_request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
