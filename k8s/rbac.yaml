apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: devops-demo
  labels:
    app.kubernetes.io/name: devops-production-demo
    app.kubernetes.io/component: api
# The application never calls the Kubernetes API, so it is given no Role and
# no RoleBinding at all -- and the token is not mounted. The default
# ServiceAccount token is a credential; a pod that does not need one should
# not carry one where an attacker could find it.
automountServiceAccountToken: false
---
# A Role is included to show the shape, scoped to the single read a future
# leader-election or config-reload feature would need. It is intentionally
# NOT bound to the api ServiceAccount: nothing today requires it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-config-reader
  namespace: devops-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["api-config"]
    verbs: ["get", "watch"]
