apiVersion: v1
kind: Namespace
metadata:
  name: devops-demo
  labels:
    app.kubernetes.io/name: devops-production-demo
    app.kubernetes.io/part-of: devops-production-demo
    # Pod Security Admission in enforcing mode. `restricted` is the strictest
    # built-in profile: no privilege escalation, non-root only, all
    # capabilities dropped, seccomp required. Setting it at the namespace is
    # what stops a future careless manifest from quietly regressing every
    # hardening decision in deployment.yaml.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
