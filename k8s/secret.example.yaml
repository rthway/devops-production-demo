# TEMPLATE ONLY -- do not apply, do not fill in and commit.
#
# This file exists so the required keys are documented in the repository while
# the values live somewhere that is actually built to hold them. Pick one:
#
#   1. Sealed Secrets / SOPS: encrypted value is safe to commit, decrypted
#      in-cluster. Good fit for GitOps.
#   2. External Secrets Operator: the value stays in Vault / AWS Secrets
#      Manager / Azure Key Vault and is projected in. Best rotation story.
#   3. Imperative, out of band, for a demo cluster only:
#
#      kubectl -n devops-demo create secret generic api-secrets \
#        --from-literal=APP_DATABASE_URL='postgresql+psycopg://app:REAL@postgres:5432/app'
#
# Note that a Kubernetes Secret is base64, not encryption. Without encryption
# at rest enabled on etcd it is plaintext to anyone who can read etcd.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: devops-demo
type: Opaque
stringData:
  APP_DATABASE_URL: "postgresql+psycopg://app:REPLACE_ME@postgres:5432/app"
  POSTGRES_PASSWORD: "REPLACE_ME"
