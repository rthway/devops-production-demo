apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devops-demo
  labels:
    app.kubernetes.io/name: devops-production-demo
    app.kubernetes.io/component: api
spec:
  # ClusterIP, not LoadBalancer: exactly one public entry point exists and it
  # is the Ingress. A per-service LoadBalancer is a second front door nobody
  # remembers to secure -- and, on a cloud provider, a second bill.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devops-production-demo
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
