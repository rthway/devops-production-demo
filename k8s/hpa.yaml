apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: devops-demo
  labels:
    app.kubernetes.io/name: devops-production-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Utilisation is a percentage OF THE REQUEST, which is why the Deployment
    # must set resources.requests -- without them the HPA has no denominator
    # and simply never scales.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React quickly to load, but not to a single noisy scrape.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Five minutes of sustained low load before removing capacity.
      # Aggressive scale-down causes flapping: capacity is removed, latency
      # rises, the HPA scales up again, and the cycle repeats.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
